<picture class="theme-svg-figure theme-svg-figure--light">
  <img src="{{ include.base }}.svg?v={{ include.version }}" alt="{{ include.alt | escape }}" loading="lazy" decoding="async">
</picture>
<picture class="theme-svg-figure theme-svg-figure--dark" aria-hidden="true">
  <img src="{{ include.base }}_dark.svg?v={{ include.version }}" alt="" loading="lazy" decoding="async">
</picture>
