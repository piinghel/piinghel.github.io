<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>
  <div class="wrapper">
    <p class="footer-note">
      <a class="footer-home" href="{{ "/" | relative_url }}">{{ site.title | escape }}</a>
      <span>{{ site.description | escape }}</span>
    </p>
    <a class="footer-feed" href="{{ site.feed.path | default: 'feed.xml' | absolute_url }}">RSS</a>
  </div>
</footer>
