<div class="ae" id="attribution-explorer" data-source="/assets/portfolio-attribution/attribution-months.json?v=1">
  <div class="ae-controls">
    <div class="ae-range">
      <label>Period <select class="ae-preset" aria-label="Period"></select></label>
      <label>from <select class="ae-from" aria-label="First year"></select></label>
      <label>to <select class="ae-to" aria-label="Last year"></select></label>
    </div>
    <div class="ae-segments ae-legs" role="radiogroup" aria-label="Book or leg">
      <button type="button" role="radio" aria-checked="true" data-leg="total">Book</button>
      <button type="button" role="radio" aria-checked="false" data-leg="long">Long leg</button>
      <button type="button" role="radio" aria-checked="false" data-leg="short">Short leg</button>
    </div>
  </div>
  <p class="ae-summary" role="status">Loading the interactive figure…</p>
  <div class="ae-chart" role="img" aria-label="Return and share of risk of each theme for the selected period"></div>
  <noscript>{% include theme-svg-figure.html base="/assets/portfolio-attribution/theme-pnl" mobile="/assets/portfolio-attribution/theme-pnl_mobile" version="3" alt="Return and share of risk of each theme, 1999–May 2026." %}</noscript>
</div>
<script src="/assets/js/attribution-explorer.js?v=3" defer></script>
