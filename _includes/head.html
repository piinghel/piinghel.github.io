<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- include theme.html -%}
  {%- seo -%}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&amp;family=Permanent+Marker&amp;family=Source+Code+Pro:wght@400;500&amp;family=Source+Serif+4:ital,wght@0,400;0,600;1,400;1,600&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="16x16 32x32 48x48">
  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
  {%- feed_meta -%}

  {%- include custom-head.html -%}
  {% if jekyll.environment == "production" and site.goatcounter %}
  <script data-goatcounter="https://{{ site.goatcounter | escape }}.goatcounter.com/count"
          async src="https://gc.zgo.at/count.js"></script>
  {% endif %}
  {% if page.interactive_charts %}
  <link rel="stylesheet" href="{{ '/assets/css/blog-charts.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <script defer src="{{ '/assets/js/blog-charts.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  {% endif %}
  
</head>
