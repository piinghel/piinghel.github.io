<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function () {
      var overrideKey = 'quant-notes-theme-override';

      function scheduledTheme(date) {
        var hour = date.getHours();
        return hour >= 21 || hour < 7 ? 'dark' : 'light';
      }

      var theme = scheduledTheme(new Date());
      try {
        var savedOverride = JSON.parse(window.localStorage.getItem(overrideKey));
        if (
          savedOverride &&
          (savedOverride.theme === 'dark' || savedOverride.theme === 'light') &&
          Number(savedOverride.expires) > Date.now()
        ) {
          theme = savedOverride.theme;
        } else {
          window.localStorage.removeItem(overrideKey);
          window.localStorage.removeItem('quant-notes-theme');
        }
      } catch (error) {
        // Private browsing or disabled storage should not block page rendering.
      }
      document.documentElement.setAttribute('data-theme', theme);
    }());
  </script>
  {%- seo -%}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&amp;family=Permanent+Marker&amp;family=Source+Code+Pro:wght@400;500&amp;family=Source+Serif+4:ital,wght@0,400;0,600;1,400;1,600&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="16x16 32x32 48x48">
  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
  {%- feed_meta -%}

  {%- include custom-head.html -%}
  {% if page.interactive_charts %}
  <link rel="stylesheet" href="{{ '/assets/css/blog-charts.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <script defer src="{{ '/assets/js/blog-charts.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  {% endif %}
  
</head>
