<header class="site-header">
  <div class="wrapper">
    <div class="site-identity">
      <a class="site-title" rel="author" href="{{ "/" | relative_url }}">
        {{ site.title | escape }}
      </a>
      <nav class="site-nav" aria-label="Primary navigation">
        <a class="page-link" href="{{ "/" | relative_url }}">Notes</a>
        {%- for link in site.header_links -%}
          <a class="page-link" href="{{ link.url | relative_url }}">{{ link.label | escape }}</a>
        {%- endfor -%}
        {%- for path in site.header_pages -%}
          {%- assign my_page = site.pages | where: "path", path | first -%}
          {%- if my_page.title -%}
            <a class="page-link" href="{{ my_page.url | relative_url }}">{{ my_page.title | escape }}</a>
          {%- endif -%}
        {%- endfor -%}
      </nav>
    </div>

    <button class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
      <span class="theme-toggle-icon" aria-hidden="true">☾</span>
      <span class="theme-toggle-label">Dark</span>
    </button>
  </div>
</header>
