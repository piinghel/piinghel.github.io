title: Pieter-Jan Inghelbrecht
url: https://piinghel.github.io
description: >
  Research notes on systematic strategies, machine learning, and portfolio construction.

theme: minima

# Preview unfinished articles only with `jekyll serve --drafts`.
show_drafts: false

exclude:
  - AGENTS.md
  - README.md
  - scripts
  - script
  - Gemfile
  - Gemfile.lock
  - minima.gemspec
  - tests
  - requirements-figures.txt
  - LICENSE.txt

sass:
  style: compressed
  load_paths:
    - assets/css

classes: wide


plugins:
  - jekyll-feed
  - jekyll-seo-tag

header_pages:
  - about.md

header_links:
  - label: Resources
    url: /quants/2025/04/20/reading-and-tools.html

minima:
  skin: classic

# Add MathJax support
markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax
