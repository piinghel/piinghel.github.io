<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="title desc">
  <title id="title">Quant Notes mark</title>
  <desc id="desc">A small network of connected observations with a moving signal.</desc>
  <style>
    .edge { fill: none; stroke: #b7d2d3; stroke-width: 1; stroke-linecap: round; }
    .node { fill: #3c8c83; animation: breathe 3.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .node:nth-of-type(2) { animation-delay: -1.2s; }
    .node:nth-of-type(3) { animation-delay: -2.4s; }
    .node:nth-of-type(4) { animation-delay: -3.1s; }
    .signal { fill: none; stroke: #345b7e; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 2 3; animation: flow 5s linear infinite; }
    @keyframes breathe { 0%, 100% { opacity: .72; transform: scale(.82); } 50% { opacity: 1; transform: scale(1.12); } }
    @keyframes flow { to { stroke-dashoffset: -20; } }
    @media (prefers-reduced-motion: reduce) { .node, .signal { animation: none; } }
  </style>
  <rect x="1.5" y="1.5" width="29" height="29" rx="8" fill="#f5faf9" stroke="#d6e5e5" stroke-width="1.5"/>
  <path class="edge" d="M7 10.5 12.8 7.5 19 10.5 25 7.5M7 10.5 12.8 16 19 10.5 25 14.5M12.8 16 14.5 24.5 25 14.5"/>
  <path class="signal" d="M7 24.5c2.4-3.8 4.5-4.1 6.3-.8 1.8 3.1 3.6 2.6 5.1-.9 1.5-3.4 3.3-3.8 5.6-1.1"/>
  <circle class="node" cx="7" cy="10.5" r="1.6"/>
  <circle class="node" cx="12.8" cy="16" r="1.6"/>
  <circle class="node" cx="19" cy="10.5" r="1.6"/>
  <circle class="node" cx="25" cy="14.5" r="1.6"/>
</svg>
