<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-labelledby="title desc">
  <title id="title">Low-volatility mark</title>
  <desc id="desc">A calm signal moving through a quiet range.</desc>
  <style>
    .signal { fill: none; stroke: #3c8c83; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
    .pulse { fill: #345b7e; }
    @media (prefers-reduced-motion: reduce) { .pulse { display: none; } }
  </style>
  <rect x="1.5" y="1.5" width="37" height="37" rx="10" fill="#fbfdfd" stroke="#dfe8e8" stroke-width="1.5"/>
  <path d="M7 12.5h26M7 20h26M7 27.5h26" stroke="#edf2f2" stroke-width="1"/>
  <path id="signal-path" class="signal" d="M7 21.5c2.5-1.5 4.2-1.5 6.2 0s3.8 1.5 5.8 0 3.8-1.5 5.8 0 3.8 1.5 6.2 0"/>
  <circle class="pulse" r="1.7">
    <animateMotion dur="4.2s" repeatCount="indefinite" path="M7 21.5c2.5-1.5 4.2-1.5 6.2 0s3.8 1.5 5.8 0 3.8-1.5 5.8 0 3.8 1.5 6.2 0"/>
  </circle>
  <path d="M7 29.5h26" stroke="#a8b2ba" stroke-width="1.4" stroke-linecap="round"/>
</svg>
