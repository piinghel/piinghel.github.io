<svg xmlns="http://www.w3.org/2000/svg" width="960" height="315" viewBox="0 0 960 315" role="img" aria-labelledby="title desc">
  <title id="title">Expanding walk-forward validation</title>
  <desc id="desc">Each fit trains on all earlier data, waits a 21-date gap, and then scores the next 600-date test block.</desc>
  <rect width="960" height="315" fill="#ffffff"/>
  <style>.fit{font:600 15px Arial,sans-serif;fill:#24364d}.hint{font:13px Arial,sans-serif;fill:#5d6d7e}.note{font:12px Arial,sans-serif;fill:#5d6d7e}</style>
  <text x="130" y="31" class="hint">time →</text><line x1="130" y1="41" x2="900" y2="41" stroke="#cfd8e2"/>
  <text x="38" y="90" class="fit">Fit 1</text><rect x="130" y="65" width="272" height="34" fill="#386889"/><rect x="402" y="65" width="16" height="34" fill="#c86b68"/><rect x="418" y="65" width="180" height="34" fill="#3b968c"/><rect x="598" y="65" width="302" height="34" fill="#eef1f4"/>
  <text x="38" y="167" class="fit">Fit 2</text><rect x="130" y="142" width="468" height="34" fill="#386889"/><rect x="598" y="142" width="16" height="34" fill="#c86b68"/><rect x="614" y="142" width="180" height="34" fill="#3b968c"/><rect x="794" y="142" width="106" height="34" fill="#eef1f4"/>
  <text x="38" y="244" class="fit">Fit k</text><rect x="130" y="219" width="664" height="34" fill="#386889"/><rect x="794" y="219" width="16" height="34" fill="#c86b68"/><rect x="810" y="219" width="90" height="34" fill="#3b968c"/>
  <g transform="translate(130 286)"><rect width="12" height="12" fill="#386889"/><text x="19" y="11" class="note">training history (starts at 900 dates)</text><rect x="286" width="12" height="12" fill="#c86b68"/><text x="305" y="11" class="note">21-date gap</text><rect x="438" width="12" height="12" fill="#3b968c"/><text x="457" y="11" class="note">next 600-date test block</text></g>
</svg>
