<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Expanding walk-forward estimation</title>
  <desc id="desc">A target-alignment strip shows a 20-session forward label protected by a 21-date gap. Four timeline rows show expanding training history followed by a gap and sequential test blocks, which form one out-of-sample score history.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .panel { fill: #ffffff; stroke: #dce5e7; stroke-width: 1.3; }
    .small { fill: #718089; font-size: 11px; font-weight: 700; letter-spacing: .08em; }
    .label { fill: #263a44; font-size: 13px; font-weight: 650; }
    .note { fill: #67767e; font-size: 12px; }
    .train { fill: #345b7e; fill-opacity: .14; stroke: #345b7e; stroke-width: 1.4; }
    .gap { fill: #bd6a67; fill-opacity: .15; stroke: #bd6a67; stroke-width: 1.25; }
    .test { fill: #3c8c83; fill-opacity: .18; stroke: #3c8c83; stroke-width: 1.4; }
    .future { fill: #f2f5f5; stroke: #dce5e7; stroke-width: 1; }
    .grid { stroke: #e5ebed; stroke-width: 1; stroke-dasharray: 2 5; }
  </style>
  <rect x="1" y="1" width="898" height="518" rx="18" fill="#fbfdfd" stroke="#e1e9ea" stroke-width="1.5"/>

  <g transform="translate(28 24)">
    <rect class="panel" width="844" height="104" rx="12"/>
    <text class="small" x="18" y="25">TARGET ALIGNMENT</text>
    <line x1="190" y1="54" x2="800" y2="54" stroke="#cbd5d8" stroke-width="1.4"/>
    <line class="grid" x1="305" y1="34" x2="305" y2="77"/>
    <circle cx="305" cy="54" r="5" fill="#345b7e"/>
    <text class="label" x="305" y="27" text-anchor="middle">signal date t</text>
    <rect x="326" y="43" width="190" height="22" rx="11" fill="#3c8c83" fill-opacity=".18" stroke="#3c8c83" stroke-width="1.2"/>
    <text class="note" x="421" y="58" text-anchor="middle">target: t+1 … t+20</text>
    <line x1="305" y1="82" x2="539" y2="82" stroke="#bd6a67" stroke-width="1.3"/>
    <path d="M305 78v8M539 78v8" stroke="#bd6a67" stroke-width="1.3"/>
    <text class="note" x="422" y="98" text-anchor="middle" fill="#a55d5a">test starts 21 dates after train end</text>
    <circle cx="539" cy="54" r="5" fill="#3c8c83"/>
    <text class="label" x="539" y="27" text-anchor="middle">test begins</text>
  </g>

  <g transform="translate(28 148)">
    <text class="small" x="0" y="15">SEQUENTIAL FITS</text>
    <g transform="translate(0 34)">
      <rect class="panel" width="844" height="230" rx="12"/>
      <line class="grid" x1="115" y1="24" x2="115" y2="205"/>
      <line class="grid" x1="335" y1="24" x2="335" y2="205"/>
      <line class="grid" x1="545" y1="24" x2="545" y2="205"/>
      <line class="grid" x1="735" y1="24" x2="735" y2="205"/>

      <text class="label" x="22" y="53">Fit 1</text>
      <rect class="train" x="94" y="34" width="221" height="28" rx="5"/>
      <text class="note" x="204" y="52" text-anchor="middle">900 training dates</text>
      <rect class="gap" x="321" y="34" width="22" height="28" rx="4"/>
      <rect class="test" x="349" y="34" width="128" height="28" rx="5"/>
      <text class="note" x="413" y="52" text-anchor="middle">600 test dates</text>
      <rect class="future" x="483" y="34" width="329" height="28" rx="5"/>

      <text class="label" x="22" y="100">Fit 2</text>
      <rect class="train" x="94" y="81" width="356" height="28" rx="5"/>
      <text class="note" x="272" y="99" text-anchor="middle">training history expands</text>
      <rect class="gap" x="456" y="81" width="22" height="28" rx="4"/>
      <rect class="test" x="484" y="81" width="128" height="28" rx="5"/>
      <rect class="future" x="618" y="81" width="194" height="28" rx="5"/>

      <text x="62" y="142" text-anchor="middle" fill="#9aa6ac" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19">⋮</text>
      <path d="M94 137h718" stroke="#d8e0e2" stroke-width="1" stroke-dasharray="3 5"/>

      <text class="label" x="22" y="182">Fit 12</text>
      <rect class="train" x="94" y="163" width="565" height="28" rx="5"/>
      <text class="note" x="376" y="181" text-anchor="middle">all available earlier history</text>
      <rect class="gap" x="665" y="163" width="22" height="28" rx="4"/>
      <rect class="test" x="693" y="163" width="119" height="28" rx="5"/>

      <text class="note" x="94" y="215">1995</text>
      <text class="note" x="812" y="215" text-anchor="end">May 2026</text>
    </g>
  </g>

  <g transform="translate(28 430)">
    <rect x="0" y="0" width="844" height="62" rx="12" fill="#f0f6f5" stroke="#cfe0df" stroke-width="1.3"/>
    <text class="small" x="18" y="22">OUT-OF-SAMPLE SCORE HISTORY</text>
    <text class="note" x="18" y="44">12 non-overlapping test blocks joined in time order</text>
    <g transform="translate(490 17)">
      <rect class="test" x="0" y="0" width="28" height="28" rx="4"/><rect class="test" x="34" y="0" width="28" height="28" rx="4"/>
      <rect class="test" x="68" y="0" width="28" height="28" rx="4"/><text x="111" y="20" fill="#809098" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">…</text>
      <rect class="test" x="139" y="0" width="28" height="28" rx="4"/><rect class="test" x="173" y="0" width="28" height="28" rx="4"/>
      <path d="M210 14h108" stroke="#3c8c83" stroke-width="2" stroke-linecap="round"/>
      <path d="m312 9 7 5-7 5" fill="none" stroke="#3c8c83" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <g transform="translate(616 145)">
    <rect x="0" y="0" width="11" height="11" rx="2" class="train"/><text class="note" x="17" y="10">training</text>
    <rect x="82" y="0" width="11" height="11" rx="2" class="gap"/><text class="note" x="99" y="10">21-date gap</text>
    <rect x="179" y="0" width="11" height="11" rx="2" class="test"/><text class="note" x="196" y="10">test</text>
  </g>
</svg>
