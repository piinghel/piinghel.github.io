<svg xmlns="http://www.w3.org/2000/svg" width="480" height="430" viewBox="0 0 480 430" role="img" aria-labelledby="title desc">
  <title id="title">Expanding walk-forward validation</title>
  <desc id="desc">Each fit trains on all earlier data, waits a 21-date gap, and then scores the next 600-date test block.</desc>
  <rect width="480" height="430" fill="#ffffff"/>
  <style>.fit{font:600 14px Arial,sans-serif;fill:#24364d}.hint{font:12px Arial,sans-serif;fill:#5d6d7e}.note{font:11px Arial,sans-serif;fill:#5d6d7e}</style>
  <text x="72" y="34" class="hint">time →</text><line x1="72" y1="43" x2="448" y2="43" stroke="#cfd8e2"/>
  <text x="18" y="97" class="fit">Fit 1</text><rect x="72" y="73" width="132" height="34" fill="#386889"/><rect x="204" y="73" width="12" height="34" fill="#c86b68"/><rect x="216" y="73" width="88" height="34" fill="#3b968c"/><rect x="304" y="73" width="144" height="34" fill="#eef1f4"/>
  <text x="18" y="184" class="fit">Fit 2</text><rect x="72" y="160" width="232" height="34" fill="#386889"/><rect x="304" y="160" width="12" height="34" fill="#c86b68"/><rect x="316" y="160" width="88" height="34" fill="#3b968c"/><rect x="404" y="160" width="44" height="34" fill="#eef1f4"/>
  <text x="18" y="271" class="fit">Fit k</text><rect x="72" y="247" width="332" height="34" fill="#386889"/><rect x="404" y="247" width="12" height="34" fill="#c86b68"/><rect x="416" y="247" width="32" height="34" fill="#3b968c"/>
  <g transform="translate(72 334)"><rect width="12" height="12" fill="#386889"/><text x="19" y="11" class="note">training history (starts at 900 dates)</text><rect y="29" width="12" height="12" fill="#c86b68"/><text x="19" y="40" class="note">21-date gap</text><rect y="58" width="12" height="12" fill="#3b968c"/><text x="19" y="69" class="note">next 600-date test block</text></g>
</svg>
