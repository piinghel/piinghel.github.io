<text x="179.0" y="254" font-size="14" text-anchor="middle" fill="#e0e6ec">Fit each model on its assigned dates</text>
<text x="179.0" y="279" font-size="14" text-anchor="middle" fill="#e0e6ec">↓  Average their prediction scores</text>
</g>
</svg>
