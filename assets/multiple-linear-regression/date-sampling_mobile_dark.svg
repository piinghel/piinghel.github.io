<circle cx="124" cy="145" r="13" fill="#294c69"/>
<text x="124" y="150" font-size="14" text-anchor="middle" fill="#e0e6ec">2</text>
<circle cx="151" cy="145" r="2" fill="#53616d"/>
<circle cx="178" cy="145" r="2" fill="#53616d"/>
<circle cx="205" cy="145" r="13" fill="#294c69"/>
<text x="205" y="150" font-size="14" text-anchor="middle" fill="#e0e6ec">5</text>
<circle cx="232" cy="145" r="2" fill="#53616d"/>
<circle cx="259" cy="145" r="2" fill="#53616d"/>
<circle cx="286" cy="145" r="13" fill="#294c69"/>
<text x="286" y="150" font-size="14" text-anchor="middle" fill="#e0e6ec">8</text>
