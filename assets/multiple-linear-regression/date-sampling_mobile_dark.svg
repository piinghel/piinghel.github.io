<svg xmlns="http://www.w3.org/2000/svg" width="358" height="302" viewBox="0 0 358 302">
<g font-family="Arial, DejaVu Sans, sans-serif" fill="#e0e6ec">
<text x="0" y="20" font-size="15" text-anchor="start" fill="#e0e6ec">Within one training window</text>
<text x="0" y="43" font-size="13" text-anchor="start" fill="#aab6c2">Each date contributes its full stock cross-section</text>
<text x="0" y="91" font-size="14" text-anchor="start" fill="#e0e6ec">Model 1</text>
<line x1="97" y1="86" x2="313" y2="86" stroke="#53616d"/>
