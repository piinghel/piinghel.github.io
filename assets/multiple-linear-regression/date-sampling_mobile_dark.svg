<circle cx="124" cy="86" r="2" fill="#53616d"/>
<circle cx="151" cy="86" r="2" fill="#53616d"/>
<circle cx="178" cy="86" r="13" fill="#294c69"/>
<text x="178" y="91" font-size="14" text-anchor="middle" fill="#e0e6ec">4</text>
<circle cx="205" cy="86" r="2" fill="#53616d"/>
<circle cx="232" cy="86" r="2" fill="#53616d"/>
<circle cx="259" cy="86" r="13" fill="#294c69"/>
<text x="259" y="91" font-size="14" text-anchor="middle" fill="#e0e6ec">7</text>
<circle cx="286" cy="86" r="2" fill="#53616d"/>
<circle cx="313" cy="86" r="2" fill="#53616d"/>
<text x="341" y="91" font-size="14" text-anchor="middle" fill="#e0e6ec">…</text>
<text x="0" y="150" font-size="14" text-anchor="start" fill="#e0e6ec">Model 2</text>
<line x1="97" y1="145" x2="313" y2="145" stroke="#53616d"/>
