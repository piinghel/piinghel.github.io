<text x="341" y="150" font-size="14" text-anchor="middle" fill="#e0e6ec">…</text>
<text x="0" y="209" font-size="14" text-anchor="start" fill="#e0e6ec">Model 3</text>
<line x1="97" y1="204" x2="313" y2="204" stroke="#53616d"/>
<circle cx="97" cy="204" r="2" fill="#53616d"/>
<circle cx="124" cy="204" r="2" fill="#53616d"/>
<circle cx="151" cy="204" r="13" fill="#294c69"/>
<text x="151" y="209" font-size="14" text-anchor="middle" fill="#e0e6ec">3</text>
<circle cx="178" cy="204" r="2" fill="#53616d"/>
<circle cx="205" cy="204" r="2" fill="#53616d"/>
<circle cx="232" cy="204" r="13" fill="#294c69"/>
<text x="232" y="209" font-size="14" text-anchor="middle" fill="#e0e6ec">6</text>
<circle cx="259" cy="204" r="2" fill="#53616d"/>
<circle cx="286" cy="204" r="2" fill="#53616d"/>
