<text x="97" y="91" font-size="14" text-anchor="middle" fill="#24333f">1</text>
<circle cx="124" cy="86" r="2" fill="#c2ccd4"/>
<circle cx="151" cy="86" r="2" fill="#c2ccd4"/>
<circle cx="178" cy="86" r="13" fill="#dbeaf5"/>
