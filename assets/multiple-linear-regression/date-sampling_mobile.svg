<text x="179.0" y="254" font-size="14" text-anchor="middle" fill="#24333f">Fit each model on its assigned dates</text>
<text x="179.0" y="279" font-size="14" text-anchor="middle" fill="#24333f">↓  Average their prediction scores</text>
</g>
</svg>
