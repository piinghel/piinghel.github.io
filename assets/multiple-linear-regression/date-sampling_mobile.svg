<circle cx="124" cy="145" r="13" fill="#dbeaf5"/>
<text x="124" y="150" font-size="14" text-anchor="middle" fill="#24333f">2</text>
<circle cx="151" cy="145" r="2" fill="#c2ccd4"/>
<circle cx="178" cy="145" r="2" fill="#c2ccd4"/>
<circle cx="205" cy="145" r="13" fill="#dbeaf5"/>
<text x="205" y="150" font-size="14" text-anchor="middle" fill="#24333f">5</text>
<circle cx="232" cy="145" r="2" fill="#c2ccd4"/>
<circle cx="259" cy="145" r="2" fill="#c2ccd4"/>
