<text x="259" y="91" font-size="14" text-anchor="middle" fill="#24333f">7</text>
<circle cx="286" cy="86" r="2" fill="#c2ccd4"/>
<circle cx="313" cy="86" r="2" fill="#c2ccd4"/>
<text x="341" y="91" font-size="14" text-anchor="middle" fill="#24333f">…</text>
<text x="0" y="150" font-size="14" text-anchor="start" fill="#24333f">Model 2</text>
<line x1="97" y1="145" x2="313" y2="145" stroke="#c2ccd4"/>
