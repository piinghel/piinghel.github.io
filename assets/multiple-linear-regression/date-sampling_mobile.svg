<text x="341" y="150" font-size="14" text-anchor="middle" fill="#24333f">…</text>
<text x="0" y="209" font-size="14" text-anchor="start" fill="#24333f">Model 3</text>
<line x1="97" y1="204" x2="313" y2="204" stroke="#c2ccd4"/>
<circle cx="97" cy="204" r="2" fill="#c2ccd4"/>
<circle cx="124" cy="204" r="2" fill="#c2ccd4"/>
<circle cx="151" cy="204" r="13" fill="#dbeaf5"/>
<text x="151" y="209" font-size="14" text-anchor="middle" fill="#24333f">3</text>
<circle cx="178" cy="204" r="2" fill="#c2ccd4"/>
<circle cx="205" cy="204" r="2" fill="#c2ccd4"/>
<circle cx="232" cy="204" r="13" fill="#dbeaf5"/>
<text x="232" y="209" font-size="14" text-anchor="middle" fill="#24333f">6</text>
