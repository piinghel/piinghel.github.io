<line x1="160" y1="204" x2="624" y2="204" stroke="#53616d"/>
<circle cx="160" cy="204" r="2" fill="#53616d"/>
<circle cx="218" cy="204" r="2" fill="#53616d"/>
<circle cx="276" cy="204" r="13" fill="#294c69"/>
